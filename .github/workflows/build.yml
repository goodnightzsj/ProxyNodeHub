name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/ProxyNodeHub.csproj

      - name: Build
        run: dotnet build src/ProxyNodeHub.csproj -c Release --nologo --no-restore

      - name: Test
        run: dotnet test tests/ProxyNodeHub.Tests/ProxyNodeHub.Tests.csproj -c Release --nologo
